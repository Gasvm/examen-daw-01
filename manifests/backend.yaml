apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturas-backend-deployment
  labels:
    app: temperaturas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperaturas-backend
  template:
    metadata:
      labels:
        app: temperaturas-backend
    spec:
      containers:
      - name: temperaturas-backend
        image: gsvmm/temperaturas-backend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: temperaturas-backend
  labels:
    app: temperaturas-backend
spec:
  selector:
    app: temperaturas-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
